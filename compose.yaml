services:
  app:
    build: .
    restart: unless-stopped
    environment:
      APP_HOST: ${APP_HOST:?definir dominio}
      APP_SECRET: ${APP_SECRET:?definir secreto}
    volumes:
      - state:/state
    logging:
      options: {max-size: "10m", max-file: "3"}
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      APP_HOST: ${APP_HOST:?definir dominio}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - tls:/data
    depends_on: [app]
volumes:
  state:
  tls:

